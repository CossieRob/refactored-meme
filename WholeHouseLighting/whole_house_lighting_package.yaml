# Whole House Lighting - package
#
# Drop into config/packages/ (with `homeassistant: packages: !include_dir_named packages`
# in configuration.yaml) and copy the blueprint to
# config/blueprints/automation/cossierob/whole_house_lighting.yaml
#
# All entity IDs below have been checked against Home Assistant.
#
# Disable the existing "Stairs Lamp On at Sunset" and "Motion Activated ..."
# automations (including "Motion Activated Loft Lights"), otherwise they will
# fight the automations below over the same lights.

input_boolean:
  lighting_automation_override:
    name: Lighting Automation Override
    icon: mdi:lightbulb-off-outline

automation:
  - id: whole_house_lighting_lounge
    alias: Lighting - Lounge
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: &common
          persons: [person.rob]
          # iPhone Focus is only used for Sleep, so it can drive sleep mode directly
          sleep_entity: binary_sensor.rob_siphone_focus
          override_entity: input_boolean.lighting_automation_override
        # Main lights; the lamps below take over while the couch or sofa is in use.
        # The reading lamp is controlled manually.
        lights:
          - light.lounge_light_1
          - light.lounge_light_2
        occupancy_sensors:
          - binary_sensor.lounge_motion_occupancy
          - binary_sensor.everything_presence_lite_fa3d18_occupancy
        suppress_sensors:
          - binary_sensor.everything_presence_lite_fa3d18_zone_1_occupancy # Sofa
          - binary_sensor.everything_presence_lite_fa3d18_zone_2_occupancy # Couch
        lux_sensor: sensor.everything_presence_lite_fa3d18_illuminance
        vacancy_timeout: 10

  - id: whole_house_lighting_lounge_lamp
    alias: Lighting - Lounge Lamp (Couch)
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.lounge_lamp]
        occupancy_sensors:
          - binary_sensor.everything_presence_lite_fa3d18_zone_2_occupancy # Couch
        lux_sensor: sensor.everything_presence_lite_fa3d18_illuminance
        vacancy_timeout: 2

  - id: whole_house_lighting_lounge_rear_lamp
    alias: Lighting - Lounge Rear Lamp (Sofa)
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.lounge_rear_lamp]
        occupancy_sensors:
          - binary_sensor.everything_presence_lite_fa3d18_zone_1_occupancy # Sofa
        lux_sensor: sensor.everything_presence_lite_fa3d18_illuminance
        vacancy_timeout: 2

  - id: whole_house_lighting_loft
    alias: Lighting - Loft
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        # Switch exposed as a light, so on/off only
        lights: [light.loft_loft_power_strip_loft_lights]
        occupancy_sensors: [binary_sensor.everything_presence_lite_f1b604_occupancy]
        lux_sensor: sensor.everything_presence_lite_f1b604_illuminance
        use_color_temp: false
        vacancy_timeout: 5

  - id: whole_house_lighting_dining_room
    alias: Lighting - Dining Room
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.dining_room_light]
        occupancy_sensors:
          - binary_sensor.dining_room_motion
          - binary_sensor.everything_presence_lite_64adcc_occupancy
        lux_sensor: sensor.everything_presence_lite_64adcc_illuminance
        vacancy_timeout: 5

  - id: whole_house_lighting_hallway
    alias: Lighting - Hallway
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.hallway_light]
        occupancy_sensors:
          - binary_sensor.hallway_motion
          - binary_sensor.hallway_motion_occupancy
        vacancy_timeout: 2

  - id: whole_house_lighting_cupboard
    alias: Lighting - Cupboard
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.cupboard_light]
        occupancy_sensors: [binary_sensor.cupboard_motion_occupancy]
        # No window: treat as dark unless the sun is very high
        elevation_threshold: 30
        day_brightness: 100
        twilight_brightness: 100
        night_brightness: 60
        vacancy_timeout: 1

  - id: whole_house_lighting_landing_stairs
    alias: Lighting - Landing & Stairs
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.landing_light, light.stairs_lamp]
        occupancy_sensors: [binary_sensor.landing_motion_occupancy]
        vacancy_timeout: 2

  - id: whole_house_lighting_office
    alias: Lighting - Office
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.office_light]
        occupancy_sensors:
          - binary_sensor.office_motion
          - binary_sensor.office_motion_occupancy
          - binary_sensor.everything_presence_lite_f1bd7c_occupancy
          - binary_sensor.office_window_motion
          - binary_sensor.3d_printer_motion # "Loft Motion"
        lux_sensor: sensor.everything_presence_lite_f1bd7c_illuminance
        vacancy_timeout: 10

  - id: whole_house_lighting_bedroom
    alias: Lighting - Bedroom
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        is_bedroom: true
        wake_lights: true
        lights: [light.bedroom_light, light.bedroom_lamp]
        occupancy_sensors:
          - binary_sensor.bedroom_motion_occupancy
          - binary_sensor.everything_presence_lite_2fbc58_occupancy
        lux_sensor: sensor.everything_presence_lite_2fbc58_illuminance
        night_brightness: 30
        vacancy_timeout: 10

  - id: whole_house_lighting_spare_room
    alias: Lighting - Spare Room
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.spare_room_light]
        occupancy_sensors: [binary_sensor.spare_room_motion_occupancy]
        vacancy_timeout: 5

  - id: whole_house_lighting_junk_room
    alias: Lighting - Junk Room
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.junk_room_light]
        occupancy_sensors: [binary_sensor.junk_room_motion_occupancy]
        vacancy_timeout: 3

  - id: whole_house_lighting_toilet
    alias: Lighting - Toilet
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.toilet_light]
        occupancy_sensors: [binary_sensor.toilet_motion_occupancy]
        # Small room with little daylight: treat as dark until the sun is well up
        elevation_threshold: 15
        vacancy_timeout: 3
