# Whole House Lighting - package
#
# Drop into config/packages/ (with `homeassistant: packages: !include_dir_named packages`
# in configuration.yaml) and copy the blueprint to
# config/blueprints/automation/cossierob/whole_house_lighting.yaml
#
# Entity IDs below were derived from entity names in Home Assistant and must be
# checked in Settings -> Devices & services -> Entities. Lines marked TODO are
# sensors that exist on a device but were not visible, so their IDs are a guess.

input_boolean:
  rob_sleep_focus:
    name: Rob Sleep Focus
    icon: mdi:sleep
  lighting_automation_override:
    name: Lighting Automation Override
    icon: mdi:lightbulb-off-outline

automation:
  - id: whole_house_lighting_lounge
    alias: Lighting - Lounge
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: &common
          persons: [person.rob]
          sleep_entity: input_boolean.rob_sleep_focus
          override_entity: input_boolean.lighting_automation_override
        lights:
          - light.lounge_lights
          - light.lounge_lamps
          - light.lounge_reading_lamp
          - light.lounge_rear_lamp
        occupancy_sensors:
          - binary_sensor.presence_sensor_fp2_f76d_presence_sensor_1
          - binary_sensor.presence_sensor_fp2_f76d_presence_sensor_2
          - binary_sensor.presence_sensor_fp2_f76d_presence_sensor_3
          - binary_sensor.presence_sensor_fp2_f76d_presence_sensor_5
          - binary_sensor.lounge_rear_window_motion
          - binary_sensor.lounge_motion # TODO: confirm ID
        lux_sensor: sensor.presence_sensor_fp2_f76d_light_sensor_light_level
        vacancy_timeout: 10

  - id: whole_house_lighting_dining_room
    alias: Lighting - Dining Room
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.dining_room_light]
        occupancy_sensors:
          - binary_sensor.dining_room_motion
          - binary_sensor.dining_room_presence_esp32_occupancy # TODO: confirm ID
        vacancy_timeout: 5

  - id: whole_house_lighting_hallway
    alias: Lighting - Hallway
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.hallway_light]
        occupancy_sensors: [binary_sensor.hallway_motion]
        vacancy_timeout: 2

  - id: whole_house_lighting_landing_stairs
    alias: Lighting - Landing & Stairs
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.landing_light, light.stairs_lamp]
        occupancy_sensors:
          - binary_sensor.landing_motion # TODO: no landing/stairs sensor was visible
        vacancy_timeout: 2

  - id: whole_house_lighting_office
    alias: Lighting - Office
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.office_light]
        occupancy_sensors:
          - binary_sensor.office_motion
          - binary_sensor.loft_motion
          - binary_sensor.desk_presence_esp32_occupancy # TODO: confirm ID
        vacancy_timeout: 10

  - id: whole_house_lighting_bedroom
    alias: Lighting - Bedroom
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        is_bedroom: true
        lights: [light.bedroom_light, light.bedroom_lamp]
        occupancy_sensors:
          - binary_sensor.bedroom_motion # TODO: confirm ID
          - binary_sensor.bedroom_presence_esp32_occupancy # TODO: confirm ID
        night_brightness: 30
        vacancy_timeout: 10

  - id: whole_house_lighting_spare_room
    alias: Lighting - Spare Room
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.spare_room_light]
        occupancy_sensors: [binary_sensor.spare_room_motion] # TODO: confirm ID
        vacancy_timeout: 5

  - id: whole_house_lighting_junk_room
    alias: Lighting - Junk Room
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.junk_room_light]
        occupancy_sensors: [binary_sensor.junk_room_motion] # TODO: confirm ID
        vacancy_timeout: 3

  - id: whole_house_lighting_toilet
    alias: Lighting - Toilet
    use_blueprint:
      path: cossierob/whole_house_lighting.yaml
      input:
        <<: *common
        lights: [light.toilet_light]
        occupancy_sensors: [binary_sensor.toilet_motion] # TODO: confirm ID
        # Windowless-ish small room: treat as dark until the sun is well up
        elevation_threshold: 15
        vacancy_timeout: 3
